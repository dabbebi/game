<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Bomb Dash</title>
</head>
<body>
    <main class="game-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">B</span>
                <div>
                    <p class="eyebrow">ARCADE RUNNER</p>
                    <h1>Bomb Dash</h1>
                </div>
            </div>
            <div class="score" aria-live="polite">
                <span class="score-label">SCORE</span>
                <span id="scoreSpan">0</span>
            </div>
        </header>

        <section id="anim" class="game" aria-label="Game area">
            <div class="stage-label"><span></span> ARCADE MODE</div>
            <div id="character" onclick="jump()">
                <img id="man" src="./img/man.gif" alt="Runner" style="width: 60px; height: auto;">
            </div>
            <div id="block">
                <img id="obstacle-image" src="./img/b1.png" alt="Bomb">
            </div>
            <p class="stage-hint">JUMP OVER THE OBSTACLES</p>
        </section>

        <footer class="footer">
            <span>Press <kbd>SPACE</kbd> or tap the runner to jump</span>
            <span class="credit">Designed by Elaid DABBEBI <span aria-hidden="true">&copy;</span> 2022</span>
        </footer>
    </main>

    <div class="popup" id="popup-1">
        <div class="overlay"></div>
        <div class="content">
            <div class="modal-icon" aria-hidden="true">B</div>
            <p class="modal-eyebrow">BOMB DASH</p>
            <h2 id="gameover"></h2>
            <p id="cont"></p>
            <button class="start" onclick="start()">Play</button>
            <p class="modal-hint">Press <kbd>SPACE</kbd> to jump</p>
        </div>
    </div>
    <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="loader-content">
            <div class="modal-icon" aria-hidden="true">B</div>
            <p class="modal-eyebrow">BOMB DASH</p>
            <p id="loading-message">Loading game assets...</p>
            <progress id="loading-progress" max="100" value="0">0%</progress>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
